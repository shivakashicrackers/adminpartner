var fmt=function(v){return v==null?"":Number(v).toLocaleString("en-IN",{minimumFractionDigits:Number.isInteger(v)?0:2,maximumFractionDigits:2})};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var q=document.getElementById("q"),sel=document.getElementById("type"),body=document.getElementById("rows"),cnt=document.getElementById("count"),empty=document.getElementById("empty");

function render(){
  var term=q.value.trim().toLowerCase(),ty=sel.value,out=[],n=0;

  });
